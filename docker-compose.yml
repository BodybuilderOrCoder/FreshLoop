services:
  db:
    image: postgres:16-alpine
    container_name: freshloop-postgres
    restart: always
    environment:
      POSTGRES_USER: freshloop_user
      POSTGRES_PASSWORD: freshloop_password123
      POSTGRES_DB: freshloop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: freshloop-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: